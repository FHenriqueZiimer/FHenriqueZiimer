    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #E6EDF3; letter-spacing: -0.02em; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #C9D1D9; }
