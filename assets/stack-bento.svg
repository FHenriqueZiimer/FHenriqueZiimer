<svg xmlns="http://www.w3.org/2000/svg" width="876" height="148" viewBox="0 0 876 148" fill="none" role="img" aria-label="Domínios e Competências Técnicas">
  <defs>
    <linearGradient id="boxBg" x1="0" y1="0" x2="0" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>
  <style>
    .head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; fill: #E6EDF3; letter-spacing: 0.06em; }
    .line { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #8B949E; }
    .accent { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #C9D1D9; }
  </style>

  <!-- Col 1: Frontend -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="209" height="147" rx="14" fill="url(#boxBg)" stroke="#30363D"/>
    <circle cx="22" cy="26" r="3.5" fill="#58A6FF"/>
    <text x="32" y="29.5" class="head">FRONTEND &amp; MOBILE</text>
    <line x1="18" y1="44" x2="191" y2="44" stroke="#21262D"/>
    <text x="18" y="68" class="accent">Next.js · React · TypeScript</text>
    <text x="18" y="90" class="line">React Native · Vue.js · PWA</text>
    <text x="18" y="112" class="line">MUI Joy · Tailwind · UI/UX</text>
    <text x="18" y="132" class="line">SSR, Streaming &amp; Design System</text>
  </g>

  <!-- Col 2: Backend -->
  <g transform="translate(222, 0)">
    <rect x="0.5" y="0.5" width="209" height="147" rx="14" fill="url(#boxBg)" stroke="#30363D"/>
    <circle cx="22" cy="26" r="3.5" fill="#3FB950"/>
    <text x="32" y="29.5" class="head">BACKEND &amp; DADOS</text>
    <line x1="18" y1="44" x2="191" y2="44" stroke="#21262D"/>
    <text x="18" y="68" class="accent">NestJS · Node.js · TypeORM</text>
    <text x="18" y="90" class="line">MongoDB · PostgreSQL · MySQL</text>
    <text x="18" y="112" class="line">APIs REST · SOAP · Zod</text>
    <text x="18" y="132" class="line">Isolamento Multi-tenant</text>
  </g>

  <!-- Col 3: IA & Integrações -->
  <g transform="translate(444, 0)">
    <rect x="0.5" y="0.5" width="209" height="147" rx="14" fill="url(#boxBg)" stroke="#30363D"/>
    <circle cx="22" cy="26" r="3.5" fill="#A371F7"/>
    <text x="32" y="29.5" class="head">IA &amp; INTEGRAÇÕES</text>
    <line x1="18" y1="44" x2="191" y2="44" stroke="#21262D"/>
    <text x="18" y="68" class="accent">OpenAI · Gemini · MCP</text>
    <text x="18" y="90" class="line">Agentes de IA em produção</text>
    <text x="18" y="112" class="line">AWS Textract &amp; OCR Documental</text>
    <text x="18" y="132" class="line">Integrações ERP &amp; Gateways</text>
  </g>

  <!-- Col 4: Cloud, DevOps & Sec -->
  <g transform="translate(666, 0)">
    <rect x="0.5" y="0.5" width="209" height="147" rx="14" fill="url(#boxBg)" stroke="#30363D"/>
    <circle cx="22" cy="26" r="3.5" fill="#E3B341"/>
    <text x="32" y="29.5" class="head">CLOUD, DEVOPS &amp; SEC</text>
    <line x1="18" y1="44" x2="191" y2="44" stroke="#21262D"/>
    <text x="18" y="68" class="accent">AWS (S3, SSM, EC2) · Docker</text>
    <text x="18" y="90" class="line">GitHub Actions · CI/CD · Vercel</text>
    <text x="18" y="112" class="line">Jest · Cypress · Git Flow</text>
    <text x="18" y="132" class="line">Aikido Security (SAST/SCA)</text>
  </g>
</svg>
