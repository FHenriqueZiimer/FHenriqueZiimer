<svg xmlns="http://www.w3.org/2000/svg" width="280" height="120" viewBox="0 0 280 120" fill="none" role="img" aria-label="Atuação Atual: Software Engineer na Lyx Engenharia">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .eyebrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #8B949E; letter-spacing: 0.08em; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #E6EDF3; letter-spacing: -0.02em; }
    .company { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #58A6FF; }
    .meta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #8B949E; }
  </style>
  <rect x="0.5" y="0.5" width="279" height="119" rx="14" fill="url(#cardBg)" stroke="#30363D"/>
  <line x1="24" y1="1" x2="256" y2="1" stroke="url(#topHighlight)" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="3.5" fill="#3FB950"/>
  <text x="34" y="27.5" class="eyebrow">ATUAÇÃO ATUAL · ROLE</text>
  <text x="20" y="56" class="title">Software Engineer</text>
  <text x="20" y="77" class="company">Lyx Engenharia ↗</text>
