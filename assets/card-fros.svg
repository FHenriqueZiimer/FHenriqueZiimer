<svg xmlns="http://www.w3.org/2000/svg" width="430" height="236" viewBox="0 0 430 236" fill="none" role="img" aria-label="Fros — SaaS Multi-tenant (fros.app)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.7" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#58A6FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .eyebrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #8B949E; letter-spacing: 0.08em; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #E3B341; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #E6EDF3; letter-spacing: -0.02em; }
    .domain { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #58A6FF; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #9EA7B3; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #C9D1D9; }
  </style>

  <rect x="0.5" y="0.5" width="429" height="235" rx="16" fill="url(#bg)" stroke="#30363D"/>
  <rect x="1" y="1" width="428" height="234" rx="15.5" fill="url(#glow)"/>
  <line x1="28" y1="1" x2="402" y2="1" stroke="url(#topLine)" stroke-width="1.5"/>

  <text x="24" y="34" class="eyebrow">SAAS MULTI-TENANT · PRODUTO PRÓPRIO</text>

  <rect x="292" y="19" width="114" height="22" rx="11" fill="#2A2111" stroke="#5A4318"/>
  <circle cx="305" cy="30" r="3" fill="#E3B341"/>
  <text x="314" y="33.5" class="badge">Em homologação</text>

  <text x="24" y="70" class="title">Fros</text>
  <text x="79" y="69" class="domain">fros.app ↗</text>

  <text x="24" y="102" class="desc">Product Hub que reúne portal do cliente (Fros Bridge),</text>
  <text x="24" y="123" class="desc">roadmap público, quadro Scrum/Kanban com SLA e a</text>
  <text x="24" y="144" class="desc">assistente de IA Lyra para triagem e estimativa de prazos.</text>

  <line x1="24" y1="170" x2="406" y2="170" stroke="#21262D" stroke-width="1"/>

  <g transform="translate(24, 186)">
    <rect x="0" y="0" width="56" height="24" rx="7" fill="#161B22" stroke="#30363D"/>
    <text x="28" y="15.5" text-anchor="middle" class="pill-text">Next.js</text>

    <rect x="62" y="0" width="56" height="24" rx="7" fill="#161B22" stroke="#30363D"/>
    <text x="90" y="15.5" text-anchor="middle" class="pill-text">NestJS</text>

    <rect x="124" y="0" width="68" height="24" rx="7" fill="#161B22" stroke="#30363D"/>
    <text x="158" y="15.5" text-anchor="middle" class="pill-text">MongoDB</text>

    <rect x="198" y="0" width="68" height="24" rx="7" fill="#161B22" stroke="#30363D"/>
    <text x="232" y="15.5" text-anchor="middle" class="pill-text">Gemini IA</text>

    <rect x="272" y="0" width="58" height="24" rx="7" fill="#161B22" stroke="#30363D"/>
    <text x="301" y="15.5" text-anchor="middle" class="pill-text">AWS S3</text>

    <rect x="336" y="0" width="46" height="24" rx="7" fill="#161B22" stroke="#30363D"/>
    <text x="359" y="15.5" text-anchor="middle" class="pill-text">Asaas</text>
  </g>
</svg>
